[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidetect"
version = "0.1.0"
description = "Detect AI-generated images: training, evaluation and inference service"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
deep = ["torch>=2.3", "torchvision>=0.18", "timm>=1.0.20"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
aidetect = "aidetect.cli:main"

[tool.setuptools.packages.find]
include = ["aidetect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
